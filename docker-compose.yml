# 一键编排四个服务：MySQL、后端、顾客端、管理后台
version: "3.8"

services:
  # 数据库：首次启动自动建库 ecommerce，数据持久化到命名卷 mysql-data
  # 注意：不映射宿主机端口，数据库只在 Docker 内网可见，避免公网暴露被扫库
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce123
    volumes:
      - mysql-data:/var/lib/mysql
    # 健康检查：只有当 MySQL 真正就绪后，backend 才会启动（避免连不上库）
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端：用环境变量覆盖数据库连接与 JWT 密钥（不写死在代码里）
  # 说明：后端不映射宿主机端口，仅通过前端 nginx 的 /api 反代在 Docker 内网访问，
  #       因此对外只暴露 80(商城) 和 8080(后台)，缩小攻击面
  backend:
    build: ./backend
    container_name: ecommerce-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: ecommerce123
      JWT_SECRET: "thisIsASecretKeyForJwtTokenGenerationMustBeLongEnoughAtLeast256Bits!!"
      # 同源反代场景下前端用 http://<ip> 和 http://<ip>:8080 访问，这里把本机常用来源都放开以防万一
      CORS_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost,http://localhost:8080"

  # 顾客端（Vue）：容器内 nginx 监听 80，映射到宿主机 80（公网直接用 IP 访问，无需带端口）
  store:
    build: ./frontend-store
    container_name: ecommerce-store
    depends_on:
      - backend
    environment:
      - PORT=80
    ports:
      - "80:80"

  # 管理后台（React）：同样 nginx 监听 80，映射到宿主机 8080
  admin:
    build: ./frontend-admin
    container_name: ecommerce-admin
    depends_on:
      - backend
    environment:
      - PORT=80
    ports:
      - "8080:80"

# 命名卷：保证 MySQL 数据在容器重建后不丢失
volumes:
  mysql-data:
