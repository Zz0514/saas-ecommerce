# 后端服务端口：Railway 会注入 PORT 环境变量，本地不设置时默认 8080
server:
  port: ${PORT:8080}

spring:
  # 数据库连接：优先用 Railway MySQL 插件提供的变量（MYSQL_*），
  # 本地 docker-compose 没有这些变量时回退到默认值
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ecommerce}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:ecommerce}
    password: ${MYSQL_PASSWORD:ecommerce123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # update：启动时不删表，自动按实体结构增量建/改表（开发友好）
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    # 序列化 JSON 时忽略 null 字段，返回更干净
    default-property-inclusion: non_null

# 自定义 JWT 配置（非 Spring 标准前缀，由 JwtUtil 通过 @Value 读取）
jwt:
  # 至少 32 个字符（HS256 需要 >=256 bit）。生产环境务必用环境变量覆盖。
  secret: ${JWT_SECRET:thisIsASecretKeyForJwtTokenGenerationMustBeLongEnoughAtLeast256Bits!!}
  expiration: ${JWT_EXPIRATION:86400000}

# 允许跨域的来源（逗号分隔）：本地默认两个前端地址，
# 部署到 Railway 时通过环境变量 CORS_ORIGINS 填两个前端的公网地址
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
